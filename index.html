<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAIT4.IT — Pop-Up Commentary for YouTube Videos</title>

  <!-- SEO -->
  <meta name="description" content="Add timestamped pop-up commentary to any YouTube video and share it with friends. No sign-up required. Inspired by VH1's Pop-Up Video.">
  <meta name="author" content="wait4.it">
  <link rel="canonical" href="https://wait4.it/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wait4.it/">
  <meta property="og:title" content="WAIT4.IT — Pop-Up Commentary for YouTube Videos">
  <meta property="og:description" content="Add timestamped pop-up commentary to any YouTube video and share it with friends. No sign-up required.">
  <meta property="og:image" content="https://wait4.it/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="628">
  <meta property="og:image:alt" content="WAIT4.IT — Pop-up commentary bubbles on a YouTube video">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="WAIT4.IT — Pop-Up Commentary for YouTube Videos">
  <meta name="twitter:description" content="Add timestamped pop-up commentary to any YouTube video and share it with friends. No sign-up required.">
  <meta name="twitter:image" content="https://wait4.it/og-image.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Theme -->
  <meta name="theme-color" content="#2D2A26">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C49ZCLS684"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-C49ZCLS684');
  </script>
</head>
<body>
  <header>
    <h1>WAIT4.IT</h1>
    <p class="header-tagline">pop-up commentary for youtube</p>
  </header>

  <main>
    <!-- Landing state -->
    <div id="landing">
      <div id="draft-banner" style="display:none;">
        <p id="draft-info"></p>
        <div class="btn-row">
          <button class="resume-btn" id="draft-resume-btn">Resume</button>
          <button class="discard-btn" id="draft-discard-btn">Dismiss</button>
        </div>
      </div>
      <p class="tagline">Add your voice to any YouTube video</p>
      <div class="url-form">
        <input type="text" id="url-input" placeholder="Paste a YouTube link..." autocomplete="off">
        <button id="watch-btn" type="button">Watch</button>
      </div>
      <div id="url-error"></div>
      <div class="how-it-works">
        <div class="step">
          <div class="step-num">1</div>
          <p>Paste a YouTube link</p>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <p>Add Comment at any moment</p>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <p>Share the link</p>
        </div>
      </div>
    </div>

    <!-- Creator state -->
    <div id="creator">
      <div class="creator-left">
        <div class="player-wrap">
          <div id="player-container"></div>
        </div>
      </div>
      <div class="creator-right">
        <div class="creator-controls">
          <button id="pop-btn" disabled>Add Comment</button>
          <span id="comment-timestamp"></span>
          <div id="comment-input-wrap">
            <form id="comment-form">
              <input type="text" id="comment-text" placeholder="What's happening here?" autocomplete="off">
              <button type="submit">Add</button>
            </form>
          </div>
          <button id="resume-btn" style="display:none;">Resume Playing</button>
        </div>
        <ul id="comment-list"></ul>
        <div style="flex:1;"></div>
        <div class="generate-section">
          <button id="generate-btn" disabled>Generate Link</button>
          <span id="size-indicator"></span>
          <span id="copy-toast">Link copied!</span>
        </div>
        <div id="generated-url">
          <input type="text" readonly id="generated-url-input">
        </div>
      </div>
    </div>

    <!-- Viewer state -->
    <div id="viewer">
      <div class="player-wrap">
        <div id="viewer-player-container"></div>
        <button id="mute-toggle" class="mute-btn" title="Toggle sound">
          <span class="mute-icon" id="mute-icon-text"></span>
        </button>
        <div class="bubble-stack" id="bubble-stack"></div>
      </div>
      <p class="create-own"><a href="." id="create-own-link">Create your own</a></p>
    </div>

    <!-- Error state -->
    <div id="error-state">
      <h2>Oops!</h2>
      <p id="error-message">This link appears to be broken or expired.</p>
      <p><a href=".">Start fresh</a></p>
    </div>
  </main>

  <footer>
    <a href="https://github.com/minusblindfold" target="_blank" rel="noopener">GitHub</a>
    <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="minusblindfold" data-color="#FFDD00" data-emoji="" data-font="Cookie" data-text="Buy me a coffee" data-outline-color="#000000" data-font-color="#000000" data-coffee-color="#ffffff"></script>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
